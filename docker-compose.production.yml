# Full prod-like stack (API + workers + Postgres).
# Usage:
#   docker compose -f docker-compose.production.yml --env-file .env.docker.local up -d --build
# Optional profiles:
#   --profile proxy
#   --profile observability

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fivesek
    ports:
      - "5545:5432"
    volumes:
      - 5sek_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d fivesek"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker.local}
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgres://user:password@db:5432/fivesek
      DATABASE_URL_DIRECT: postgres://user:password@db:5432/fivesek
      DB_SSL_MODE: disable
      INLINE_BACKGROUND_WORKER: "false"
      INLINE_INJECTION_WORKER: "false"
      UNLIMITED_ANSWER_CREATION: "1"
      ANSWER_POST_COOLDOWN_SECONDS: "0"
      REQUIRE_HTTPS: "false"
      ALLOW_DEV_SHOP_GRANT: "1"
      ALLOW_NON_CLOUDINARY_MEDIA: "1"
    ports:
      - "3000:3000"
    command: ["node", "server.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker.local}
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgres://user:password@db:5432/fivesek
      DATABASE_URL_DIRECT: postgres://user:password@db:5432/fivesek
      DB_SSL_MODE: disable
      INLINE_BACKGROUND_WORKER: "false"
      INLINE_INJECTION_WORKER: "false"
    command: ["node", "scripts/run-job-worker.js"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  duel-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker.local}
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgres://user:password@db:5432/fivesek
      DATABASE_URL_DIRECT: postgres://user:password@db:5432/fivesek
      DB_SSL_MODE: disable
      INLINE_DUEL_WORKER: "false"
    command: ["node", "scripts/run-duel-worker.js"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  injector:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker.local}
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgres://user:password@db:5432/fivesek
      DATABASE_URL_DIRECT: postgres://user:password@db:5432/fivesek
      DB_SSL_MODE: disable
      INLINE_BACKGROUND_WORKER: "false"
      INLINE_INJECTION_WORKER: "false"
    command: ["node", "scripts/run-injection-worker.js"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true


volumes:
  5sek_pgdata:
